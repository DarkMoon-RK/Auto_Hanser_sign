name: Run auto

on:
  schedule:
    - cron: "01 16 * * *"
    - cron: "00 06 * * *"
    - cron: "01 17 * * *"
  workflow_dispatch:

jobs:
  run-main:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Install Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chromePath)) {
            Invoke-WebRequest `
              -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
              -OutFile "$env:TEMP\chrome_installer.exe"

            Start-Process `
              -FilePath "$env:TEMP\chrome_installer.exe" `
              -ArgumentList "/silent /install" `
              -NoNewWindow -Wait
          }

          if (-not (Test-Path $chromePath)) {
            throw "Chrome installation failed."
          }

      - name: Install matching ChromeDriver from Chrome for Testing API
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $chromeVersion = (Get-Item $chromePath).VersionInfo.ProductVersion
          Write-Host "Installed Chrome version: $chromeVersion"

          # 只取 3 段版本号，例如 152.0.0.0 -> 152.0.0.0
          $version = $chromeVersion.Trim()

          # 查询 Chrome for Testing 的已知版本
          $knownGood = Invoke-RestMethod "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions.json"

          # 找到精确的 Chrome 版本
          $match = $knownGood.versions |
            Where-Object { $_.version -eq $version } |
            Select-Object -First 1

          if (-not $match) {
            throw "No matching Chrome for Testing version found for Chrome $version"
          }

          $driverInfo = $match.downloads.chromedriver |
            Where-Object { $_.platform -eq "win64" } |
            Select-Object -First 1

          if (-not $driverInfo) {
            throw "No compatible win64 ChromeDriver found for Chrome $version"
          }

          $driverUrl = $driverInfo.url
          $driverDir = "C:\tools\chromedriver"
          $driverZip = "$env:TEMP\chromedriver.zip"
          $driverExe = "$driverDir\chromedriver.exe"

          New-Item -ItemType Directory -Force -Path $driverDir | Out-Null
          Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip
          Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force

          if (-not (Test-Path $driverExe)) {
            throw "ChromeDriver extraction failed."
          }

          $env:PATH = "$driverDir;$env:PATH"
          Write-Host "ChromeDriver downloaded from: $driverUrl"

      - name: Create settings.json
        shell: pwsh
        env:
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SETTINGS_JSON)) {
            throw "SETTINGS_JSON secret is empty."
          }

          $env:SETTINGS_JSON | Set-Content -Path "setting.json" -Encoding utf8

      - name: Run main.py
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python main.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "setting.json") {
            Remove-Item "setting.json" -Force
          }
