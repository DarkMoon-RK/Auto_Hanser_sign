name: Run auto

on:
  schedule:
    - cron: "01 16 * * *"
    - cron: "00 06 * * *"
    - cron: '01 17 * * *'
  workflow_dispatch:

jobs:
  run-main:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }
      env:
        PYTHONIOENCODING: utf-8

    - name: Remove incompatible ChromeDriver from PATH
      shell: pwsh
      run: |
        $oldDriver = "C:\SeleniumWebDrivers\ChromeDriver\chromedriver.exe"
        if (Test-Path $oldDriver) {
          Remove-Item $oldDriver -Force
          Write-Host "Removed old ChromeDriver: $oldDriver"
        } else {
          Write-Host "No pre-existing ChromeDriver found at $oldDriver"
        }

    - name: Run main.py
      env:
        SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
      run: |
        echo $env:SETTINGS_JSON > setting.json
        python main.py
        Remove-Item setting.json
