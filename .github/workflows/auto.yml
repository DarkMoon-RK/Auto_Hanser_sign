name: Run auto

on:
  schedule:
    - cron: "01 16 * * *"
    - cron: "00 06 * * *"
    - cron: "01 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-main:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Check Chrome installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $chromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
          )

          $chromePath = $chromePaths |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $chromePath) {
            throw "Google Chrome was not found on the GitHub Actions runner."
          }

          $chromeVersion = (Get-Item $chromePath).VersionInfo.ProductVersion

          Write-Host "Chrome path: $chromePath"
          Write-Host "Chrome version: $chromeVersion"

      - name: Create settings file
        shell: pwsh
        env:
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SETTINGS_JSON)) {
            throw "The SETTINGS_JSON secret is empty or has not been configured."
          }

          $env:SETTINGS_JSON | Set-Content -Path "setting.json" -Encoding utf8

          # 验证 JSON 格式，但不输出密码等敏感信息
          python -c "import json; json.load(open('setting.json', encoding='utf-8')); print('SETTINGS_JSON is valid JSON')"

      - name: Run main.py
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python main.py

      - name: Remove settings file
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "setting.json") {
            Remove-Item "setting.json" -Force
          }
