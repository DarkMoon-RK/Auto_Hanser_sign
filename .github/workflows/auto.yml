name: Run auto

on:
  schedule:
    - cron: "01 16 * * *"
    - cron: "00 06 * * *"
    - cron: "01 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-main:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Install matching Chrome and ChromeDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $chromeRoot = "C:\tools\chrome"
          $driverRoot = "C:\tools\chromedriver"

          $chromeZip = "$env:TEMP\chrome-win64.zip"
          $driverZip = "$env:TEMP\chromedriver-win64.zip"

          $chromeExe = "$chromeRoot\chrome-win64\chrome.exe"
          $driverExe = "$driverRoot\chromedriver-win64\chromedriver.exe"

          # 获取 Chrome for Testing 最新稳定版本
          $stableInfo = Invoke-RestMethod `
            -Uri "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"

          $chromeVersion = $stableInfo.channels.Stable.version

          Write-Host "Chrome for Testing version: $chromeVersion"

          # 获取该版本对应的 Chrome 和 ChromeDriver 下载地址
          $knownGood = Invoke-RestMethod `
            -Uri "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json"

          $versionInfo = $knownGood.versions |
            Where-Object { $_.version -eq $chromeVersion } |
            Select-Object -First 1

          if (-not $versionInfo) {
            throw "Cannot find Chrome for Testing version $chromeVersion"
          }

          $chromeDownload = $versionInfo.downloads.chrome |
            Where-Object { $_.platform -eq "win64" } |
            Select-Object -First 1

          $driverDownload = $versionInfo.downloads.chromedriver |
            Where-Object { $_.platform -eq "win64" } |
            Select-Object -First 1

          if (-not $chromeDownload) {
            throw "Cannot find win64 Chrome download URL"
          }

          if (-not $driverDownload) {
            throw "Cannot find win64 ChromeDriver download URL"
          }

          New-Item -ItemType Directory -Force -Path $chromeRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $driverRoot | Out-Null

          Invoke-WebRequest `
            -Uri $chromeDownload.url `
            -OutFile $chromeZip

          Invoke-WebRequest `
            -Uri $driverDownload.url `
            -OutFile $driverZip

          Expand-Archive `
            -Path $chromeZip `
            -DestinationPath $chromeRoot `
            -Force

          Expand-Archive `
            -Path $driverZip `
            -DestinationPath $driverRoot `
            -Force

          if (-not (Test-Path $chromeExe)) {
            throw "Chrome was not found at $chromeExe"
          }

          if (-not (Test-Path $driverExe)) {
            throw "ChromeDriver was not found at $driverExe"
          }

          Write-Host "Chrome path: $chromeExe"
          Write-Host "ChromeDriver path: $driverExe"

          # 传递给后续步骤和 main.py
          "CHROME_BINARY=$chromeExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHROME_DRIVER=$driverExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create settings file
        shell: pwsh
        env:
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SETTINGS_JSON)) {
            throw "SETTINGS_JSON secret is empty or missing"
          }

          $env:SETTINGS_JSON |
            Set-Content -Path "setting.json" -Encoding utf8

          python -c "import json; json.load(open('setting.json', encoding='utf-8')); print('SETTINGS_JSON is valid JSON')"

      - name: Run main.py
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python main.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "setting.json") {
            Remove-Item "setting.json" -Force
          }
