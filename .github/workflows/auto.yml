name: Run auto

on:
  schedule:
    - cron: "01 16 * * *"
    - cron: "00 06 * * *"
    - cron: "01 17 * * *"
  workflow_dispatch:

jobs:
  run-main:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

      - name: Install Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chromePath)) {
            Invoke-WebRequest `
              -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
              -OutFile "$env:TEMP\chrome_installer.exe"

            Start-Process `
              -FilePath "$env:TEMP\chrome_installer.exe" `
              -ArgumentList "/silent /install" `
              -NoNewWindow -Wait
          }

          if (-not (Test-Path $chromePath)) {
            throw "Chrome installation failed."
          }

      - name: Install matching ChromeDriver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          $version = (Get-Item $chromePath).VersionInfo.ProductVersion
          $major = ($version.Split('.')[0])

          $driverVersion = (Invoke-RestMethod "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$major").Trim()
          $driverDir = "C:\tools\chromedriver"
          $driverZip = "$env:TEMP\chromedriver.zip"
          $driverExe = "$driverDir\chromedriver.exe"

          New-Item -ItemType Directory -Force -Path $driverDir | Out-Null

          Invoke-WebRequest `
            -Uri "https://chromedriver.storage.googleapis.com/$driverVersion/chromedriver_win32.zip" `
            -OutFile $driverZip

          Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force

          if (-not (Test-Path $driverExe)) {
            throw "ChromeDriver download or extraction failed."
          }

          $env:PATH = "$driverDir;$env:PATH"

          Write-Host "Chrome version: $version"
          Write-Host "ChromeDriver version: $driverVersion"

      - name: Create settings.json
        shell: pwsh
        env:
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SETTINGS_JSON)) {
            throw "SETTINGS_JSON secret is empty."
          }

          $env:SETTINGS_JSON | Set-Content -Path "setting.json" -Encoding utf8

      - name: Run main.py
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python main.py

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "setting.json") {
            Remove-Item "setting.json" -Force
          }
